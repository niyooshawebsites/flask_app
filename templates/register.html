<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flask App - Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>

  <body
    style="height: 100vh"
    class="container-fluid d-flex flex-column justify-content-between"
  >
    <header>
      <nav class="navbar navbar-expand-lg px-5">
        <div class="container-fluid px-5">
          <a class="navbar-brand" href="#">Flask App</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavDropdown"
            aria-controls="navbarNavDropdown"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Account
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="/register">Register</a>
                  </li>
                  <li><a class="dropdown-item" href="/login">Login</a></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <div
      class="container d-flex flex-column justify-content-between align-items-center"
    >
      <form class="card w-25 p-4 bg-light rounded-lg">
        <h2 class="text-primary text-center mb-4">Register</h2>
        <div class="form-group mb-3">
          <label for="email" class="text-sm text-muted mb-1">Email</label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="john@example.com"
            required
            class="form-control"
          />
        </div>

        <div class="form-group mb-3">
          <label for="username" class="text-sm text-muted mb-1">Username</label>
          <input
            type="text"
            name="username"
            id="username"
            placeholder="John"
            required
            class="form-control"
          />
        </div>

        <div class="form-group mb-3">
          <label for="password" class="text-sm text-muted mb-1">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="********"
            required
            class="form-control"
          />
        </div>

        <input type="submit" value="Register" class="btn btn-dark" />

        <hr />
        <p class="text-center">
          Already have an account? <a href="/login">Login</a>
        </p>
      </form>
    </div>

    <footer>
      <p class="text-muted text-sm text-center">
        &copy; 2026. All Rights Reserved.
      </p>
    </footer>
  </body>
</html>
